services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    networks:
      - public_network
    environment:
      - NGINX_HOST=netflix-frontend
    depends_on:
      - netflix-frontend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  netflix-frontend:
    image: guymeltzer/nf:13
    container_name: netflix-frontend
    ports:
      - "3000:3000"
    networks:
      - public_network
      - private_network
    depends_on:
      - netflix-catalog
    environment:
      MOVIE_CATALOG_SERVICE: http://netflix-catalog:8080

  netflix-catalog:
    image: guymeltzer/netflix-movie-catalog:16
    container_name: netflix-catalog
    networks:
      - private_network
    volumes:
      - catalog-data:/data
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    command: >
      sh -c "
        echo 'AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}' &&
        echo 'AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}' &&
        echo 'AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}' &&
        apt-get update && 
        apt-get install -y python3-pip && 
        pip3 install boto3 && 
        python3 /app/app.py
      "

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - private_network2
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "472"
    networks:
      - private_network2
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  availability-agent:
    image: guymeltzer/availability_agent:1.0.0
    hostname: availability-agent
    container_name: availability-agent
    networks:
      - private_network2
      - public_network
    depends_on:
      - prometheus
    environment:
      MONITORED_HOST: http://netflix-frontend:3000

networks:
  public_network:
    driver: bridge
  private_network:
    driver: bridge
  private_network2:
    driver: bridge

volumes:
  catalog-data:
    driver_opts:
      type: none
      device: /mnt/ebs/catalog-data
      o: bind
  prometheus-data:
    driver_opts:
      type: none
      device: /mnt/ebs/prometheus-data
      o: bind
  grafana-data:
    driver_opts:
      type: none
      device: /mnt/ebs/grafana-data
      o: bind
