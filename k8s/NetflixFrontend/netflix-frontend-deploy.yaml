apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-frontend
  labels:
    app: netflix-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-frontend
  template:
    metadata:
      labels:
        app: netflix-frontend
    spec:
      containers:
      - name: netflix-frontend
        image: guymeltzer/nf:13
        ports:
        - containerPort: 3000
        env:
        - name: MOVIE_CATALOG_SERVICE
          value: "http://netflix-movie-catalog:8080" # This matches the name of the Service and port
        - name:   AWS_SQS_QUEUE_URL
          value: https://sqs.eu-north-1.amazonaws.com/352708296901/Guy-Queue
        - name: AWS_REGION
          value: eu-north-1
        - name: AWS_SNS_TOPIC_ARN
          value: arn:aws:sns:eu-north-1:352708296901:Guy-netflix-event-topic


---
apiVersion: v1
kind: Service
metadata:
  name: netflix-frontend-service
  labels:
    app: netflix-frontend
spec:
  selector:
    app: netflix-frontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000


---

apiVersion: v1
kind: Service
metadata:
  name: netflix-frontend-nodeport
spec:
  type: NodePort
  selector:
    app: netflix-frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001  # Optional field, if not specified, the control plane will allocate a port from a range (default: 30000-32767)