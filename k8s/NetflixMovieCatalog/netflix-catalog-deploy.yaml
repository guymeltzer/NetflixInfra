apiVersion: batch/v1
kind: Job
metadata:
  name: data-loader
spec:
  template:
    spec:
      containers:
        - name: data-loader
          image: guymeltzer/netflix-movie-catalog:11
          command: ["python3", "data_loader.py"]
      restartPolicy: Never
  backoffLimit: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-catalog
  labels:
    app: netflix-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-catalog
  template:
    metadata:
      labels:
        app: netflix-catalog
    spec:
      containers:
      - name: netflix-catalog
        image: guymeltzer/netflix-movie-catalog:11

---
apiVersion: v1
kind: Service
metadata:
  name: netflix-movie-catalog
  labels:
    app: netflix-catalog
spec:
  selector:
    app: netflix-catalog
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080